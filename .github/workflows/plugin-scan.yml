# HOL AI Plugin Scanner: the same scan the awesome-ai-plugins listing runs,
# on every push and pull request. Fails below 80 or on a high finding.
name: Plugin scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashgraph-online/ai-plugin-scanner-action@9b169fc65d09b24726b66d70b3563ab563158b58 # v1.2.816
        with:
          plugin_dir: "."
          mode: scan
          min_score: 80
          fail_on_severity: high
